name: "Bug report"
description: "Something in the skill or its scripts does not work as documented."
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem.

        **Do not post your real origin IP addresses, hostnames, certificates or secrets.** This repository is public, and an origin address published in an issue is exactly the leak this project exists to prevent. Replace them with documentation placeholders such as `203.0.113.10`, `2001:db8::10` and `example.com` before you paste commands or output.

        Found a security vulnerability in this project? Report it privately instead, as described in SECURITY.md.
  - type: checkboxes
    id: privacy
    attributes:
      label: "Before you submit"
      options:
        - label: "I replaced every real origin IP, hostname and secret with a placeholder such as 203.0.113.10 or example.com."
          required: true
        - label: "This is not a security vulnerability. Vulnerabilities go to the private report form."
          required: true
  - type: dropdown
    id: component
    attributes:
      label: "Which part is affected?"
      options:
        - "check_origin_lockdown.py (the self-audit)"
        - "generate_cf_firewall_rules.py (the rule generator)"
        - "The skill (SKILL.md or a reference playbook)"
        - "Documentation"
        - "Accessibility"
        - "Something else"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Version"
      description: "The release or commit you used."
      placeholder: "v2.0.1"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened, and what did you expect?"
    validations:
      required: true
  - type: textarea
    id: command-output
    attributes:
      label: "Command and output, with placeholders"
      description: "The exact command you ran and what it printed. For the checker, --json output is easiest to read."
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "Operating system, Python version, firewall backend (nftables, iptables-nft, iptables-legacy, ufw or a cloud firewall), and whether Docker or Kubernetes runs on the host."
      placeholder: "Ubuntu 24.04, Python 3.12, nftables 1.0.9, Docker 29"
